# ReconQA project-level configuration (shared by CLI and Web API)
project_name: example-webapp

target:
  domain: api.example.com
  base_url: https://api.example.com

scenarios:
  - name: 01_browse_search
    start_url: https://app.example.com/
    paths:
      - /
      - /search
    description: Browse catalog and search endpoints
  - name: 02_detail_cart
    start_url: https://app.example.com/items
    paths:
      - /items
      - /cart
    description: Item detail and shopping cart mutations

biz_success_rules:
  - field: code
    value: 0

ignore_path_prefixes:
  - /static/
  - /assets/
  - /_next/static/
  - /favicon.ico

extra_api_prefixes:
  - /api/

java:
  package_name: com.reconqa.generated
  java_version: "21"
  latency_multiplier: 3.0

k6:
  stages:
    - duration: 15s
      target: 10
    - duration: 30s
      target: 30
    - duration: 30s
      target: 60
    - duration: 15s
      target: 0
  proxy_url: null
  no_conn_reuse: false

security:
  include_mutations: false
  custom_secret_patterns: {}
