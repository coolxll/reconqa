[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconqa"
version = "0.1.0"
description = "ReconQA: One-recording, multi-use Web/API testing platform powered by HAR 1.2 + OpenAPI 3.0.3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "httpx[socks]>=0.27.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
recorder = [
    "playwright>=1.48.0",
    "mitmproxy>=11.0.0",
]
fuzz = [
    "schemathesis>=3.38.0",
]
postgres = [
    "asyncpg>=0.30.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
mcp = [
    "mcp>=1.2.0",
]

[project.scripts]
reconqa = "reconqa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/reconqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
